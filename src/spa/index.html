<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      if (
        !/^\/(admin|login|options|preview|register|activate\/)/.test(
          location.pathname,
        )
      ) {
        window.__treePreload = fetch("/api/tree", {
          credentials: "same-origin",
        });
      }
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/128-inverted-round.png" />
    <!-- ponytail: single generic splash instead of the full per-device
         apple-touch-startup-image matrix; upgrade if iOS launch flicker
         becomes a real complaint. -->
    <link
      rel="apple-touch-startup-image"
      href="/icons/128-inverted-round.png"
    />
    <title>FeedFathom</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
