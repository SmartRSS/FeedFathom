<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FeedFathom options</title>
    <link rel="stylesheet" href="extension.css" />
  </head>
  <body>
    <div class="form-container">
      <form>
        <div class="input-block">
          <label for="instance">Instance:</label>
          <input
            id="instance"
            type="text"
            inputmode="url"
            aria-describedby="instance-error"
            placeholder="https://feeds.example.com"
          />
          <p class="field-error" id="instance-error" role="alert"></p>
          <div class="connection-row">
            <button id="test-connection" type="button">Test connection</button>
            <p
              aria-live="polite"
              class="connection-status"
              id="connection-status"
              role="status"
            ></p>
          </div>
        </div>
        <div class="input-block">
          <label class="checkbox-row" for="show-badge">
            <input id="show-badge" type="checkbox" />
            Show a toolbar badge with the number of feeds found on the page
          </label>
        </div>
      </form>
    </div>
    <script src="options.js"></script>
  </body>
</html>
