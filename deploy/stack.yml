# Production on Docker Swarm, as an overlay on the root compose.yml:
#
#   docker stack deploy -c compose.yml -c deploy/stack.yml "$STACK_NAME"
#
# Everything the application needs -- images, environment, health probes --
# comes from compose.yml, so there is exactly one place to change a variable.
# This file adds only what Swarm needs and Compose has no concept of:
# replica counts, rolling updates, resource reservations, and the fact that
# the data volumes already exist on the host.
#
# `docker stack deploy` prints "Ignoring unsupported options: restart" for
# compose.yml's `restart: always`. That is expected; deploy.restart_policy
# below is what governs restarts here.
#
# The migrator runs at zero replicas because Swarm ignores depends_on and
# would otherwise restart a completed migration forever. The workflow runs
# migrations as a separate replicated-job service that doubles as a
# deployment lock, before updating the application services.

services:
  migrator:
    deploy:
      replicas: 0

  redis:
    deploy:
      replicas: 1
      restart_policy: &restart-policy
        condition: any
        delay: 5s
        window: 30s

  postgres:
    command: ["-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-1000}"]
    deploy:
      replicas: 1
      restart_policy: *restart-policy

  server:
    stop_grace_period: 20s
    deploy:
      replicas: ${APP_REPLICAS:-1}
      restart_policy: *restart-policy
      update_config: &server-rollout
        parallelism: 1
        delay: 10s
        order: start-first
        # Must stay >= the healthcheck's worst-case time-to-unhealthy
        # (start_period 120s + retries 3 * interval 5s = 135s in
        # compose.yml), or a rollout can be reported successful before a
        # slow-to-start task is actually confirmed healthy. start-first also
        # runs the new task alongside the one it replaces, doubling resource
        # pressure exactly when it needs to boot, so the budget needs real
        # headroom.
        #
        # The workflow migrates to completion before deploying, so tasks here
        # normally find the schema already applied and go healthy in seconds
        # -- this budget is the ceiling, not the usual wait.
        monitor: 150s
        failure_action: rollback
      rollback_config:
        <<: *server-rollout
        failure_action: pause

  worker:
    deploy:
      replicas: ${WORKER_REPLICAS:-10}
      restart_policy: *restart-policy
      resources:
        limits:
          cpus: "${WORKER_CPU_LIMIT:-0.50}"
          memory: "${WORKER_MEM_LIMIT:-1500M}"
        # start-first rolling updates need update_config.parallelism extra
        # reservations' worth of CPU free on the node beyond WORKER_REPLICAS
        # * WORKER_CPU_RESERVATION, or new tasks cannot schedule until old
        # ones stop -- and old ones will not stop until the new ones are
        # healthy, deadlocking the rollout. Keep real headroom when scaling
        # WORKER_REPLICAS or parallelism up on a capacity-constrained node.
        reservations:
          cpus: "${WORKER_CPU_RESERVATION:-0.25}"
          memory: "${WORKER_MEM_RESERVATION:-500M}"
      update_config: &worker-rollout
        parallelism: 4
        delay: 5s
        order: start-first
        # Same invariant as the server's monitor above. At the default 10
        # replicas this is three batches, so a worst case where every batch
        # waits out the full budget is a ~8 minute rollout; the usual case is
        # seconds per batch, because the migration already finished.
        monitor: 150s
        failure_action: rollback
      rollback_config:
        <<: *worker-rollout
        failure_action: pause

volumes:
  postgres_storage_17:
    external: true
    name: ${POSTGRES_VOLUME_NAME:?Set POSTGRES_VOLUME_NAME to the existing PostgreSQL volume}
  redis_storage:
    external: true
    name: ${REDIS_VOLUME_NAME:?Set REDIS_VOLUME_NAME to the existing Redis volume}

networks:
  backend:
    driver: overlay
