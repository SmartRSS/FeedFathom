services:
  migrator:
    deploy:
      replicas: 0

  redis:
    deploy:
      replicas: 1
      restart_policy: &restart-policy
        condition: any
        delay: 5s
        window: 30s

  postgres:
    command: ["-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-1000}"]
    deploy:
      replicas: 1
      restart_policy: *restart-policy

  server:
    stop_grace_period: 20s
    deploy:
      replicas: ${APP_REPLICAS:-1}
      restart_policy: *restart-policy
      update_config: &server-rollout
        parallelism: 1
        delay: 10s
        order: start-first
        monitor: 60s
        failure_action: rollback
      rollback_config:
        <<: *server-rollout
        failure_action: pause

  worker:
    deploy:
      replicas: ${WORKER_REPLICAS:-10}
      restart_policy: *restart-policy
      resources:
        limits:
          cpus: "${WORKER_CPU_LIMIT:-0.50}"
          memory: "${WORKER_MEM_LIMIT:-1500M}"
        reservations:
          cpus: "${WORKER_CPU_RESERVATION:-0.25}"
          memory: "${WORKER_MEM_RESERVATION:-500M}"
      update_config: &worker-rollout
        parallelism: 4
        delay: 5s
        order: start-first
        monitor: 60s
        failure_action: rollback
      rollback_config:
        <<: *worker-rollout
        failure_action: pause

volumes:
  postgres_storage_17:
    external: true
    name: ${POSTGRES_VOLUME_NAME:?Set POSTGRES_VOLUME_NAME to the existing PostgreSQL volume}
  redis_storage:
    external: true
    name: ${REDIS_VOLUME_NAME:?Set REDIS_VOLUME_NAME to the existing Redis volume}

networks:
  backend:
    driver: overlay
