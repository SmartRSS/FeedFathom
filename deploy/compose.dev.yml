# Development overlay. Never used alone:
#
#   docker compose -f compose.yml -f deploy/compose.dev.yml up -d --build --wait
#
# `bun run dev` runs exactly that, then starts Vite on the host.
#
# It replaces the three published images with one image built from this
# checkout, mounts the backend source read-only so `bun --watch` reloads on
# save, and moves the published port to 3001 so Vite can own 3456 and proxy
# /api to the container. Everything else -- Redis, PostgreSQL, health
# probes, startup order -- is inherited unchanged from compose.yml.
#
# Building requires a Docker Hardened Images login: `docker login dhi.io`.
#
# It also carries the project name. compose.yml cannot declare a top-level
# `name`, because the legacy Swarm loader rejects it, so each Compose
# overlay names the project it belongs to.
name: feedfathom

x-dev-image: &dev-image
  image: feedfathom-dev:local
  build:
    context: .
    dockerfile: Dockerfile
    target: dev

services:
  migrator:
    <<: *dev-image
    command: ["src/migrator.ts"]
    volumes:
      - ./src:/app/src:ro
      # Every service resolves the journal import from disk here, rather
      # than from a bundle as the release images do; the migrator also reads
      # the migration files themselves at runtime.
      - ./drizzle:/app/drizzle:ro

  server:
    <<: *dev-image
    command: ["--watch", "src/server.ts"]
    # !override replaces the inherited mapping instead of adding to it;
    # without it Compose would keep the base's 3456 binding and collide
    # with Vite.
    ports: !override
      - "127.0.0.1:3001:3000"
    environment:
      ENABLE_REGISTRATION: "true"
      MAIL_RELAY_SECRET: ${MAIL_RELAY_SECRET:-local-development-relay-secret}
    volumes:
      - ./src:/app/src:ro
      # Bun resolves src/platform/db/connection.ts's journal import from disk here,
      # rather than from a bundle as the release images do.
      - ./drizzle:/app/drizzle:ro

  worker:
    <<: *dev-image
    command: ["--watch", "src/worker.ts"]
    volumes:
      - ./src:/app/src:ro
      # Bun resolves src/platform/db/connection.ts's journal import from disk here,
      # rather than from a bundle as the release images do.
      - ./drizzle:/app/drizzle:ro
