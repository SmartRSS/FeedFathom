name: feedfathom

x-dev-image: &dev-image
  image: feedfathom-dev:local
  build:
    context: .
    dockerfile: Dockerfile
    target: dev

services:
  migrator:
    <<: *dev-image
    command: ["src/migrator.ts"]
    volumes:
      - ./src:/app/src:ro
      - ./drizzle:/app/drizzle:ro

  server:
    <<: *dev-image
    command: ["--watch", "src/server.ts"]
    ports: !override
      - "127.0.0.1:${FEEDFATHOM_DEV_API_PORT:-3001}:3000"
    environment:
      ENABLE_REGISTRATION: "true"
      MAIL_RELAY_SECRET: ${MAIL_RELAY_SECRET:-local-development-relay-secret}
    volumes:
      - ./src:/app/src:ro
      - ./drizzle:/app/drizzle:ro

  worker:
    <<: *dev-image
    command: ["--watch", "src/worker.ts"]
    volumes:
      - ./src:/app/src:ro
      - ./drizzle:/app/drizzle:ro
