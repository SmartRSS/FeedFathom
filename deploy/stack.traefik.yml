services:
  server:
    networks:
      backend: {}
      traefik: {}
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=${TRAEFIK_NETWORK_NAME:?Set TRAEFIK_NETWORK_NAME to the external Traefik overlay}"
        - "traefik.http.routers.feedfathom.rule=Host(`${FEED_FATHOM_DOMAIN:?Set FEED_FATHOM_DOMAIN to the public host}`)"
        - "traefik.http.routers.feedfathom.entrypoints=web"
        - "traefik.http.routers.feedfathom.service=feedfathom"
        - "traefik.http.routers.feedfathom-alt.rule=Host(`${FEED_FATHOM_ALT_DOMAIN:?Set FEED_FATHOM_ALT_DOMAIN to the alternate public host}`)"
        - "traefik.http.routers.feedfathom-alt.entrypoints=web"
        - "traefik.http.routers.feedfathom-alt.service=feedfathom"
        - "traefik.http.services.feedfathom.loadbalancer.server.port=3000"

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK_NAME:?Set TRAEFIK_NETWORK_NAME to the external Traefik overlay}
