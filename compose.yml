# FeedFathom, self-hosted. Everything you need is in this one file:
#
#   docker compose up -d
#
# It pulls published images from GHCR, so no source build and no registry
# login are required. Open http://127.0.0.1:3456.
#
# This is also the single source for every other way the project runs. Three
# overlays extend it, and each is applied with a second -f or -c. They are
# alternatives, never combined with one another:
#
#   deploy/compose.dev.yml    local development against source
#   deploy/compose.smoke.yml  CI's release-image smoke test
#   deploy/stack.yml          production on Docker Swarm
#
# `docker stack deploy` still uses Docker's legacy Compose loader, which
# constrains what may appear below: no top-level `name`, no long-form
# `depends_on`, and no nested ${} defaults, all of which it either rejects
# or silently mangles. The comments on those three spots say so where they
# would otherwise look like arbitrary choices.

# Both application services connect to the same database and answer the same
# health probe on the same port, so both are defined once here.
x-database-env: &database-env
  # Flat on purpose: the legacy Swarm loader cannot parse a nested ${}
  # default and silently produces a malformed URL instead of failing. So
  # this default does not follow POSTGRES_USER/PASSWORD/DB -- change those
  # and you must set DATABASE_URL to match.
  DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/postgres}
  DB_POOL_MAX: ${DB_POOL_MAX:-10}

x-app-healthcheck: &app-healthcheck
  test:
    [
      "CMD",
      "/usr/local/bin/bun",
      "-e",
      "process.exit((await fetch('http://127.0.0.1:3000/healthcheck')).ok ? 0 : 1)",
    ]
  interval: 5s
  timeout: 2s
  retries: 3
  start_period: 10s

services:
  redis:
    image: redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_storage:/data
    networks:
      - backend

  postgres:
    image: pgautoupgrade/pgautoupgrade:17-bookworm
    restart: always
    command: ["-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-100}"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    # pg_isready alone reports success during the first-run bootstrap, while
    # the server is still up only on its private socket. Following it with a
    # real query is what makes `--wait` mean "ready for the migrator".
    healthcheck:
      test: 'pg_isready --username=${POSTGRES_USER:-postgres} && psql --username=${POSTGRES_USER:-postgres} -c "SELECT 1;"'
      interval: 1s
      timeout: 1s
      retries: 25
      start_period: 1s
    volumes:
      - postgres_storage_17:/var/lib/postgresql/data
    networks:
      - backend

  # Runs to completion before the application starts, on every `up`. Schema
  # changes are forward-only; there is no down migration.
  migrator:
    init: true
    image: ghcr.io/smartrss/feedfathom/feedfathom-migrator:${FEEDFATHOM_TAG:-latest}
    environment: *database-env
    # Short-form because the legacy Swarm loader rejects the long form.
    # It only orders starts, not readiness, which is why the migrator
    # retries its first connection and the application services restart
    # until the schema is there. See src/migrator.ts.
    depends_on:
      - postgres
    networks:
      - backend

  server:
    init: true
    image: ghcr.io/smartrss/feedfathom/feedfathom-server:${FEEDFATHOM_TAG:-latest}
    restart: always
    ports:
      - "${FEEDFATHOM_PORT:-3456}:3000"
    environment:
      <<: *database-env
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      ENABLE_REGISTRATION: ${ENABLE_REGISTRATION:-false}
      # Used for newsletter addresses and for links in outbound email, so it
      # is needed even when nothing sits in front of the published port.
      FEED_FATHOM_DOMAIN: ${FEED_FATHOM_DOMAIN:-localhost:3456}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      # Where inbound newsletter mail is routed, which is not necessarily
      # the host the app is served from. Defaults to FEED_FATHOM_DOMAIN.
      MAIL_DOMAIN: ${MAIL_DOMAIN:-}
      MAIL_RELAY_SECRET: ${MAIL_RELAY_SECRET:-}
      MAILJET_API_KEY: ${MAILJET_API_KEY:-}
      MAILJET_API_SECRET: ${MAILJET_API_SECRET:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    # A longer start_period than the shared default, because the server
    # refuses to listen until its migration is applied (see src/server.ts)
    # and the probe cannot connect until then. 30s covers a cold start and a
    # small upgrade; a slower migration leaves the server restarting until it
    # finishes, which is noisy but self-correcting.
    healthcheck:
      <<: *app-healthcheck
      start_period: 30s
    # The migrator is deliberately absent. Short-form depends_on could only
    # order its start anyway, never its completion, and listing it would make
    # `up --wait` report its clean exit(0) as a failure. Correctness comes
    # from the worker waiting on the Drizzle migrations journal instead
    # (waitForMigration in src/platform/db/connection.ts).
    depends_on:
      - redis
      - postgres
    tmpfs:
      - /tmp
    networks:
      - backend

  worker:
    init: true
    image: ghcr.io/smartrss/feedfathom/feedfathom-worker:${FEEDFATHOM_TAG:-latest}
    restart: always
    environment:
      <<: *database-env
      DEBUG: "bull:*"
      # WebSub subscribe attempts happen here, not in the server, and the
      # callback URL cannot be built without this.
      FEED_FATHOM_DOMAIN: ${FEED_FATHOM_DOMAIN:-localhost:3456}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-25}
      LOCK_DURATION: ${LOCK_DURATION:-60}
      CLEANUP_INTERVAL: ${CLEANUP_INTERVAL:-20}
      GATHER_JOBS_INTERVAL: ${GATHER_JOBS_INTERVAL:-20}
      USER_DORMANT_AFTER_DAYS: ${USER_DORMANT_AFTER_DAYS:-365}
      ARTICLE_STALE_AFTER_DAYS: ${ARTICLE_STALE_AFTER_DAYS:-365}
      USER_EXPIRY_DAYS: ${USER_EXPIRY_DAYS:-730}
    healthcheck: *app-healthcheck
    stop_grace_period: 5m
    depends_on:
      - redis
      - postgres
    tmpfs:
      - /tmp
    networks:
      - backend

# Declared without a driver so deploy/stack.yml can mark them external and
# switch the network to overlay; naming a driver here would conflict.
volumes:
  redis_storage: {}
  postgres_storage_17: {}

networks:
  backend: {}
