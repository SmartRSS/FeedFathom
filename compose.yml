x-database-env: &database-env
  DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/postgres}
  DB_POOL_MAX: ${DB_POOL_MAX:-}

x-app-healthcheck: &app-healthcheck
  test:
    [
      "CMD",
      "/usr/local/bin/bun",
      "-e",
      "process.exit((await fetch('http://127.0.0.1:3000/healthcheck')).ok ? 0 : 1)",
    ]
  interval: 5s
  timeout: 2s
  retries: 3
  start_period: 45s

services:
  redis:
    image: redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_storage:/data
    networks:
      - backend

  postgres:
    image: pgautoupgrade/pgautoupgrade:17-bookworm
    restart: always
    command: ["-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-100}"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    healthcheck:
      test: 'pg_isready --username=${POSTGRES_USER:-postgres} && psql --username=${POSTGRES_USER:-postgres} -c "SELECT 1;"'
      interval: 1s
      timeout: 1s
      retries: 25
      start_period: 1s
    volumes:
      - postgres_storage_17:/var/lib/postgresql/data
    networks:
      - backend

  migrator:
    init: true
    image: ghcr.io/smartrss/feedfathom/feedfathom-migrator:${FEEDFATHOM_TAG:-latest}
    environment: *database-env
    depends_on:
      - postgres
    networks:
      - backend

  server:
    init: true
    image: ghcr.io/smartrss/feedfathom/feedfathom-server:${FEEDFATHOM_TAG:-latest}
    restart: always
    ports:
      - "${FEEDFATHOM_PORT:-3456}:3000"
    environment:
      <<: *database-env
      REDIS_URL: ${REDIS_URL:-}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      ENABLE_REGISTRATION: ${ENABLE_REGISTRATION:-}
      FEED_FATHOM_DOMAIN: ${FEED_FATHOM_DOMAIN:-localhost:3456}
      MAIL_ENABLED: ${MAIL_ENABLED:-}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-}
      MAIL_RELAY_SECRET: ${MAIL_RELAY_SECRET:-}
      MAILJET_API_KEY: ${MAILJET_API_KEY:-}
      MAILJET_API_SECRET: ${MAILJET_API_SECRET:-}
      CLOUDFLARE_EMAIL_ACCOUNT_ID: ${CLOUDFLARE_EMAIL_ACCOUNT_ID:-}
      CLOUDFLARE_EMAIL_API_TOKEN: ${CLOUDFLARE_EMAIL_API_TOKEN:-}
      POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TRUSTED_PROXY_HEADER: ${TRUSTED_PROXY_HEADER:-}
      SLOW_REQUEST_MS: ${SLOW_REQUEST_MS:-}
    healthcheck: *app-healthcheck
    depends_on:
      - redis
      - postgres
    tmpfs:
      - /tmp
    networks:
      - backend

  worker:
    init: true
    image: ghcr.io/smartrss/feedfathom/feedfathom-worker:${FEEDFATHOM_TAG:-latest}
    restart: always
    environment:
      <<: *database-env
      REDIS_URL: ${REDIS_URL:-}
      FEED_FATHOM_DOMAIN: ${FEED_FATHOM_DOMAIN:-localhost:3456}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-}
      LOCK_DURATION: ${LOCK_DURATION:-}
      CLEANUP_INTERVAL: ${CLEANUP_INTERVAL:-}
      GATHER_JOBS_INTERVAL: ${GATHER_JOBS_INTERVAL:-}
      USER_DORMANT_AFTER_DAYS: ${USER_DORMANT_AFTER_DAYS:-}
      ARTICLE_STALE_AFTER_DAYS: ${ARTICLE_STALE_AFTER_DAYS:-}
      USER_EXPIRY_DAYS: ${USER_EXPIRY_DAYS:-}
    healthcheck: *app-healthcheck
    stop_grace_period: 2m
    depends_on:
      - redis
      - postgres
    tmpfs:
      - /tmp
    networks:
      - backend

volumes:
  redis_storage: {}
  postgres_storage_17: {}

networks:
  backend: {}
