name: Set up Bun project
description: Install Bun, restore caches, and install dependencies from the lockfile.

inputs:
  playwright:
    description: Also cache and install the Playwright Chromium browser.
    default: "false"

runs:
  using: composite
  steps:
    # The version lives in package.json's packageManager field so local and CI
    # cannot drift; Renovate is disabled, so every extra pin is hand-maintained.
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Cache Bun global cache
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Cache Playwright browsers
      if: inputs.playwright == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/bun.lock') }}

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Install Playwright Chromium
      if: inputs.playwright == 'true'
      shell: bash
      run: bunx playwright install --with-deps chromium
