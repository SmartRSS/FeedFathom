name: Set up Bun project
description: Install Bun, restore caches, and install dependencies from the lockfile.

inputs:
  playwright:
    description: Also cache and install the Playwright Chromium browser.
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Cache Bun global cache
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Read Playwright version
      if: inputs.playwright == 'true'
      id: playwright-version
      shell: bash
      run: |
        VERSION=$(bun -e 'const pkg = await Bun.file("node_modules/@playwright/test/package.json").json(); process.stdout.write(pkg.version);')
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      if: inputs.playwright == 'true'
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

    - name: Install Playwright Chromium
      if: inputs.playwright == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: bunx playwright install chromium
