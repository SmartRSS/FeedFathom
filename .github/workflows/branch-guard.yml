name: Branch guard

# main is promoted from staging only. GitHub rulesets can require checks and a
# pull request, but have no rule constraining which branch a PR comes *from*,
# so the constraint is expressed as a status check the main ruleset requires.
#
# This job's name is load-bearing: the main branch ruleset pins it as a
# required status check by context name. Renaming it retires the check it is
# pinned to and silently blocks every PR into main. Change the two together.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  source_branch:
    name: Merges into main come from staging
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Verify the head is this repository's staging branch
        # Passed through the environment rather than interpolated into the
        # script, so a branch name cannot inject shell. The repository is
        # checked as well as the branch name: a fork may also have a branch
        # called "staging", and that is not the same branch.
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_REPO" != "$THIS_REPO" ]]; then
            echo "::error::PRs into main must come from this repository's staging branch, but this one comes from the fork '$HEAD_REPO'. Open it against staging instead."
            exit 1
          fi
          if [[ "$HEAD_REF" != "staging" ]]; then
            echo "::error::PRs into main must come from staging, but this one comes from '$HEAD_REF'. Merge into staging first, then promote staging to main."
            exit 1
          fi
          echo "Head is $THIS_REPO staging."
