name: Quality Checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Job ids are load-bearing: the main branch ruleset pins its four required
# status checks by context name ("quality / lint" and friends), which is
# "<caller job> / <this job's name, or its id when unnamed>". Renaming a job
# here, or giving it a `name:`, silently blocks every PR into main until the
# ruleset is updated to match.
jobs:
  lint:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Bun project
        uses: ./.github/actions/bun-project

      - name: Run lint
        run: bun run lint

  build:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Bun project
        uses: ./.github/actions/bun-project

      - name: Build every deployable target
        run: bun run build-project

  unit:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/feedfathom_migration_test
      MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/feedfathom_migration_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: feedfathom_migration_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready --username=postgres --dbname=feedfathom_migration_test"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
        ports:
          - 5432:5432
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Bun project
        uses: ./.github/actions/bun-project

      - name: Run unit tests
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == 'pull_request' ]]; then
            # Unit tests statically import what they test, so bun's --changed
            # (which walks that import graph) is safe here.
            git fetch --depth=1 origin "${{ github.event.pull_request.base.ref }}"
            bun test --changed="origin/${{ github.event.pull_request.base.ref }}" \
              --path-ignore-patterns='tests/browser/**' \
              --path-ignore-patterns='tests/migration-integration.test.ts'
          else
            bun run test:unit
          fi

      - name: Test database migrations
        run: bun run test:migrations

  browser:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Bun project
        uses: ./.github/actions/bun-project
        with:
          playwright: "true"

      - name: Run browser tests
        # Playwright's --only-changed can't see app code loaded at runtime
        # over HTTP (only static imports the spec file itself makes), so
        # this stays a full run on every trigger -- see the "unit" job's
        # comment above for the confirmed reasoning.
        run: bun run test:browser
