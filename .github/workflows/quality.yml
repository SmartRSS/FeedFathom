name: Quality Checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun project
        uses: ./.github/actions/bun-project

      - name: Run lint
        run: bun run lint

      - name: Check every required status check still reports
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun bin/check-required-checks.ts

      - name: Check deploy script
        run: shellcheck deploy/deploy.sh

  compile:
    name: Compile every deployable target
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun project
        uses: ./.github/actions/bun-project

      - name: Build every deployable target
        run: bun run build-project

  unit:
    name: Unit and migration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/feedfathom_migration_test
      MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/feedfathom_migration_test
      REDIS_TEST_URL: redis://127.0.0.1:6379/15
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
        ports:
          - 6379:6379
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: feedfathom_migration_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready --username=postgres --dbname=feedfathom_migration_test"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
        ports:
          - 5432:5432
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun project
        uses: ./.github/actions/bun-project

      - name: Run unit tests
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == 'pull_request' ]]; then
            git fetch --depth=1 origin "${{ github.event.pull_request.base.ref }}"
            bun test --parallel=2 --changed="origin/${{ github.event.pull_request.base.ref }}" \
              --path-ignore-patterns='tests/browser/**' \
              --path-ignore-patterns='**/*-integration.test.ts'
          else
            bun run test:unit
          fi

      - name: Run integration tests
        run: bun run test:integration

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun project
        uses: ./.github/actions/bun-project
        with:
          playwright: "true"

      - name: Run browser tests
        run: bun run test:browser
