name: Deploy Docs

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set extension release metadata
        run: |
          YEAR=$(date -u +%Y)
          MONTH_DAY=$(date -u +%-m%-d)
          EXTENSION_VERSION="$YEAR.$MONTH_DAY.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          {
            echo "EXTENSION_VERSION=$EXTENSION_VERSION"
            echo "BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')"
          } >> "$GITHUB_ENV"

      - name: Build extension variants
        env:
          FIREFOX_UPDATE_URL: ${{ env.PAGES_URL }}/assets/updates.json
        run: bun run build-extension

      - name: Sign Firefox extension
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          mkdir -p signed-extension docs/assets/extension
          bunx web-ext sign \
            --source-dir ext/build-ff \
            --artifacts-dir signed-extension \
            --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" \
            --no-input \
            --timeout 900000 \
            --approval-timeout 900000

          shopt -s nullglob
          SIGNED_XPIS=(signed-extension/*.xpi)
          if [ "${#SIGNED_XPIS[@]}" -ne 1 ]; then
            echo "Expected one AMO-signed XPI, found ${#SIGNED_XPIS[@]}" >&2
            exit 1
          fi
          cp "${SIGNED_XPIS[0]}" docs/assets/extension/feedfathom_ff.xpi
          cp ext/feedfathom_ch.zip docs/assets/extension/feedfathom_ch.zip

      - name: Create Firefox update manifest
        run: |
          FF_HASH=$(sha256sum docs/assets/extension/feedfathom_ff.xpi | cut -d' ' -f1)
          export FF_HASH
          bun -e '
            const manifest = await Bun.file("ext/build-ff/manifest.json").json();
            const gecko = manifest.browser_specific_settings.gecko;
            const updates = {
              addons: {
                [gecko.id]: {
                  updates: [{
                    version: manifest.version,
                    update_link: `${process.env.PAGES_URL}/assets/extension/feedfathom_ff.xpi`,
                    update_hash: `sha256:${process.env.FF_HASH}`,
                    applications: {
                      gecko: { strict_min_version: gecko.strict_min_version },
                    },
                  }],
                },
              },
            };
            await Bun.write(
              "docs/assets/updates.json",
              `${JSON.stringify(updates, null, 2)}\n`,
            );
          '

      - name: Verify signed Firefox release
        run: |
          unzip -Z1 docs/assets/extension/feedfathom_ff.xpi | grep -q '^META-INF/'
          unzip -p docs/assets/extension/feedfathom_ff.xpi manifest.json > /tmp/signed-manifest.json
          bun -e '
            const generated = await Bun.file("ext/build-ff/manifest.json").json();
            const signed = await Bun.file("/tmp/signed-manifest.json").json();
            const updates = await Bun.file("docs/assets/updates.json").json();
            const update = updates.addons[generated.browser_specific_settings.gecko.id].updates[0];
            if (
              signed.version !== generated.version ||
              signed.browser_specific_settings.gecko.strict_min_version !==
                generated.browser_specific_settings.gecko.strict_min_version ||
              update.version !== generated.version ||
              update.applications.gecko.strict_min_version !==
                generated.browser_specific_settings.gecko.strict_min_version
            ) {
              throw new Error("Firefox release metadata does not match");
            }
          '

      - name: Update extension documentation
        run: |
          sed -i \
            -e "s|FIREFOX_VERSION|$EXTENSION_VERSION|g" \
            -e "s|CHROME_VERSION|$EXTENSION_VERSION|g" \
            -e "s|FIREFOX_DOWNLOAD_URL|$PAGES_URL/assets/extension/feedfathom_ff.xpi|g" \
            -e "s|CHROME_DOWNLOAD_URL|$PAGES_URL/assets/extension/feedfathom_ch.zip|g" \
            -e "s|BUILD_DATE|$BUILD_DATE|g" \
            docs/extension.md

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
