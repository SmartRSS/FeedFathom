name: Label issues fixed on staging

on:
  pull_request:
    branches:
      - staging
    types: [closed]

permissions:
  contents: read

jobs:
  label:
    name: Label issues the merged PR closes
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Add on-staging to each closed issue
        run: |
          set -euo pipefail
          numbers=$(printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" \
            | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+$' | sort -un || true)
          for n in $numbers; do
            gh issue edit "$n" --add-label on-staging
          done
