name: Build, Verify, and Deploy Docker Images

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:
    inputs:
      deploy_tag:
        description: Full 40-character lowercase commit SHA already published to GHCR
        required: true
        type: string

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  pr_smoke:
    name: Build and smoke internal PR images
    needs: quality
    if: >-
      needs.quality.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOCKER_DEFAULT_PLATFORM: linux/amd64
      FEEDFATHOM_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hardened Images registry
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: Build and load exact PR images
        run: docker compose -f deploy/compose.smoke.yml build migrator server worker

      - name: Pull smoke infrastructure images
        run: docker compose -f deploy/compose.smoke.yml pull redis postgres

      - name: Start exact local images without pulling
        run: docker compose -f deploy/compose.smoke.yml up -d --wait --wait-timeout 300 --no-build --pull never

      - name: Run production browser smoke test
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3456
        run: bun run test:smoke

      - name: Print logs on failure
        if: failure()
        run: |
          printf '%s\n' 'Verification failed. Printing logs for all services:'
          docker compose -f deploy/compose.smoke.yml logs migrator worker server
          printf '%s\n' 'Current container status:'
          docker compose -f deploy/compose.smoke.yml ps

      - name: Cleanup
        if: always()
        run: docker compose -f deploy/compose.smoke.yml down

  build:
    name: Publish ${{ matrix.target }} immutable image
    needs: quality
    if: >-
      needs.quality.result == 'success' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    strategy:
      fail-fast: false
      matrix:
        target:
          - feedfathom-server
          - feedfathom-worker
          - feedfathom-migrator
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hardened Images registry
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository name
        run: printf 'REPO_NAME=%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and publish immutable ${{ matrix.target }} image
        uses: docker/build-push-action@v7
        timeout-minutes: 30
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          tags: ghcr.io/${{ env.REPO_NAME }}/${{ matrix.target }}:${{ github.sha }}
          provenance: false

  build_extension:
    name: Build and sign browser extension
    needs: quality
    if: >-
      needs.quality.result == 'success' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    outputs:
      build_date: ${{ steps.metadata.outputs.build_date }}
      extension_version: ${{ steps.metadata.outputs.extension_version }}
    env:
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set extension release metadata
        id: metadata
        run: |
          YEAR=$(date -u +%Y)
          MONTH_DAY=$(date -u +%-m%-d)
          EXTENSION_VERSION="$YEAR.$MONTH_DAY.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"
          {
            echo "extension_version=$EXTENSION_VERSION"
            echo "build_date=$BUILD_DATE"
          } >> "$GITHUB_OUTPUT"

      - name: Build extension variants
        env:
          FIREFOX_UPDATE_URL: ${{ env.PAGES_URL }}/assets/updates.json
          EXTENSION_VERSION: ${{ steps.metadata.outputs.extension_version }}
        run: bun run build-extension

      - name: Sign Firefox extension
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          mkdir -p signed-extension dist-extension
          bunx web-ext sign \
            --source-dir ext/build-ff \
            --artifacts-dir signed-extension \
            --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" \
            --no-input \
            --timeout 900000 \
            --approval-timeout 900000

          shopt -s nullglob
          SIGNED_XPIS=(signed-extension/*.xpi)
          if [ "${#SIGNED_XPIS[@]}" -ne 1 ]; then
            echo "Expected one AMO-signed XPI, found ${#SIGNED_XPIS[@]}" >&2
            exit 1
          fi
          cp "${SIGNED_XPIS[0]}" dist-extension/feedfathom_ff.xpi
          cp ext/feedfathom_ch.zip dist-extension/feedfathom_ch.zip
          cp ext/build-ff/manifest.json dist-extension/manifest.json

      - name: Verify signed Firefox release
        run: |
          unzip -Z1 dist-extension/feedfathom_ff.xpi | grep -q '^META-INF/'
          unzip -p dist-extension/feedfathom_ff.xpi manifest.json > /tmp/signed-manifest.json
          bun -e '
            const generated = await Bun.file("ext/build-ff/manifest.json").json();
            const signed = await Bun.file("/tmp/signed-manifest.json").json();
            if (
              signed.version !== generated.version ||
              signed.browser_specific_settings.gecko.strict_min_version !==
                generated.browser_specific_settings.gecko.strict_min_version
            ) {
              throw new Error("Signed Firefox manifest does not match the generated one");
            }
          '

      - name: Upload signed extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: extension-build
          path: dist-extension
          retention-days: 30

  validate_deploy_tag:
    name: Validate existing deployment manifests
    needs: quality
    if: >-
      needs.quality.result == 'success' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_TAG: ${{ inputs.deploy_tag }}

    steps:
      - name: Require a full immutable commit SHA
        run: |
          if [[ ! "$DEPLOY_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' 'deploy_tag must be exactly 40 lowercase hexadecimal characters' >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository name
        run: printf 'REPO_NAME=%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Verify all exact-tag manifests exist
        run: |
          set -euo pipefail
          for target in feedfathom-server feedfathom-worker feedfathom-migrator; do
            docker buildx imagetools inspect "ghcr.io/${REPO_NAME}/${target}:${DEPLOY_TAG}" >/dev/null
          done

  # Split into a push-path and a dispatch-path caller (instead of one shared
  # job juggling both) so a normal push run's dependency chain never has a
  # naturally-skipped job in it -- validate_deploy_tag (workflow_dispatch
  # only) would otherwise sit between build and release_smoke and force
  # every downstream job (promote, create_release) to add always() just to
  # survive that skip.
  release_smoke_push:
    name: Smoke exact published images (push)
    needs: [quality, build]
    if: >-
      needs.quality.result == 'success' &&
      github.event_name == 'push' &&
      needs.build.result == 'success'
    uses: ./.github/workflows/release-smoke.yml
    permissions:
      contents: read
      packages: read
    with:
      checkout_ref: ${{ github.sha }}
      feedfathom_tag: ${{ github.sha }}

  release_smoke_dispatch:
    name: Smoke exact published images (dispatch)
    needs: [quality, validate_deploy_tag]
    if: >-
      needs.quality.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      needs.validate_deploy_tag.result == 'success'
    uses: ./.github/workflows/release-smoke.yml
    permissions:
      contents: read
      packages: read
    with:
      checkout_ref: ${{ inputs.deploy_tag }}
      feedfathom_tag: ${{ inputs.deploy_tag }}

  promote:
    name: Promote verified ${{ matrix.target }} manifest to a channel tag
    needs: [quality, build, release_smoke_push]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') &&
      needs.quality.result == 'success' &&
      needs.build.result == 'success' &&
      needs.release_smoke_push.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        target:
          - feedfathom-server
          - feedfathom-worker
          - feedfathom-migrator
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      CHANNEL_TAG: ${{ github.ref == 'refs/heads/main' && 'latest' || 'staging' }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository name
        run: printf 'REPO_NAME=%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Promote exact verified manifest
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${REPO_NAME}/${{ matrix.target }}:${CHANNEL_TAG}" \
            "ghcr.io/${REPO_NAME}/${{ matrix.target }}:${GITHUB_SHA}"

  create_release:
    name: Create GitHub release
    needs: [build, build_extension, release_smoke_push, promote]
    if: >-
      always() &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') &&
      needs.build.result == 'success' &&
      needs.build_extension.result == 'success' &&
      needs.release_smoke_push.result == 'success' &&
      needs.promote.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXTENSION_VERSION: ${{ needs.build_extension.outputs.extension_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download signed extension artifact
        uses: actions/download-artifact@v8
        with:
          name: extension-build
          path: dist-extension

      - name: Set release metadata
        run: |
          set -euo pipefail
          printf 'REPO_NAME=%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          if [[ "${{ github.ref }}" == 'refs/heads/main' ]]; then
            {
              echo "TAG=v${EXTENSION_VERSION}"
              echo "TITLE=FeedFathom v${EXTENSION_VERSION}"
              echo "PRERELEASE=false"
            } >> "$GITHUB_ENV"
          else
            {
              echo "TAG=staging-${EXTENSION_VERSION}"
              echo "TITLE=Staging ${EXTENSION_VERSION}"
              echo "PRERELEASE=true"
            } >> "$GITHUB_ENV"
          fi
          mv dist-extension/feedfathom_ff.xpi "dist-extension/feedfathom-firefox-${EXTENSION_VERSION}.xpi"
          mv dist-extension/feedfathom_ch.zip "dist-extension/feedfathom-chrome-${EXTENSION_VERSION}.zip"

      - name: Create release
        run: |
          set -euo pipefail
          prerelease_flag=()
          if [[ "$PRERELEASE" == 'true' ]]; then
            prerelease_flag+=(--prerelease)
          fi
          # Anchor notes on the last *stable* release (not the last staging
          # prerelease), so staging prereleases stay cumulative until
          # promoted, and a stable release's notes aren't truncated by an
          # intervening staging prerelease.
          notes_start_tag=()
          LAST_STABLE_TAG=$(gh release list --exclude-drafts --exclude-pre-releases \
            --json tagName,createdAt -q 'sort_by(.createdAt) | reverse | .[0].tagName // empty')
          if [[ -n "$LAST_STABLE_TAG" ]]; then
            notes_start_tag=(--notes-start-tag "$LAST_STABLE_TAG")
          fi
          gh release create "$TAG" \
            --title "$TITLE" \
            --target "${{ github.sha }}" \
            --generate-notes \
            "${notes_start_tag[@]}" \
            "${prerelease_flag[@]}" \
            "dist-extension/feedfathom-firefox-${EXTENSION_VERSION}.xpi" \
            "dist-extension/feedfathom-chrome-${EXTENSION_VERSION}.zip"

          IMAGE_NOTES=$(cat <<EOF

          ## Images
          Published to GHCR at this commit (\`${GITHUB_SHA}\`):
          - \`ghcr.io/${REPO_NAME}/feedfathom-server:${GITHUB_SHA}\`
          - \`ghcr.io/${REPO_NAME}/feedfathom-worker:${GITHUB_SHA}\`
          - \`ghcr.io/${REPO_NAME}/feedfathom-migrator:${GITHUB_SHA}\`
          EOF
          )
          EXISTING_BODY=$(gh release view "$TAG" --json body -q .body)
          gh release edit "$TAG" --notes "${EXISTING_BODY}${IMAGE_NOTES}"

  deploy:
    runs-on: ubuntu-24.04
    needs:
      [
        quality,
        build,
        validate_deploy_tag,
        release_smoke_push,
        release_smoke_dispatch,
        promote,
      ]
    if: >-
      always() &&
      vars.ENABLE_SWARM_DEPLOYMENT == 'true' &&
      github.ref == 'refs/heads/main' &&
      needs.quality.result == 'success' &&
      ((github.event_name == 'push' &&
        needs.build.result == 'success' &&
        needs.validate_deploy_tag.result == 'skipped' &&
        needs.release_smoke_push.result == 'success' &&
        needs.release_smoke_dispatch.result == 'skipped' &&
        needs.promote.result == 'success') ||
       (github.event_name == 'workflow_dispatch' &&
        needs.build.result == 'skipped' &&
        needs.validate_deploy_tag.result == 'success' &&
        needs.release_smoke_push.result == 'skipped' &&
        needs.release_smoke_dispatch.result == 'success' &&
        needs.promote.result == 'skipped'))
    timeout-minutes: 30
    permissions:
      contents: read
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      FEEDFATHOM_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_tag || github.sha }}
      STACK_NAME: ${{ vars.STACK_NAME }}
      POSTGRES_VOLUME_NAME: ${{ vars.POSTGRES_VOLUME_NAME }}
      REDIS_VOLUME_NAME: ${{ vars.REDIS_VOLUME_NAME }}
      SERVER_HOST_PORT: ${{ vars.SERVER_HOST_PORT }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      FEED_FATHOM_DOMAIN: ${{ secrets.FEED_FATHOM_DOMAIN }}
      FEED_FATHOM_ALT_DOMAIN: ${{ vars.FEED_FATHOM_ALT_DOMAIN }}
      ALLOWED_EMAILS: ${{ vars.ALLOWED_EMAILS }}
      ENABLE_REGISTRATION: ${{ vars.ENABLE_REGISTRATION }}
      APP_REPLICAS: ${{ vars.APP_REPLICAS }}
      WORKER_REPLICAS: ${{ vars.WORKER_REPLICAS }}
      WORKER_CONCURRENCY: ${{ vars.WORKER_CONCURRENCY }}
      LOCK_DURATION: ${{ vars.LOCK_DURATION }}
      CLEANUP_INTERVAL: ${{ vars.CLEANUP_INTERVAL }}
      GATHER_JOBS_INTERVAL: ${{ vars.GATHER_JOBS_INTERVAL }}
      WORKER_CPU_LIMIT: ${{ vars.WORKER_CPU_LIMIT }}
      WORKER_MEM_LIMIT: ${{ vars.WORKER_MEM_LIMIT }}
      WORKER_CPU_RESERVATION: ${{ vars.WORKER_CPU_RESERVATION }}
      WORKER_MEM_RESERVATION: ${{ vars.WORKER_MEM_RESERVATION }}
      MAIL_ENABLED: ${{ vars.MAIL_ENABLED }}
      MAIL_RELAY_SECRET: ${{ secrets.MAIL_RELAY_SECRET }}
      MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
      MAILJET_API_SECRET: ${{ secrets.MAILJET_API_SECRET }}
      TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}

    steps:
      - name: Checkout deployment stack
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_tag || github.sha }}
          sparse-checkout: |
            deploy/stack.yml
            deploy/stack.port.yml
          sparse-checkout-cone-mode: false

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure trusted SSH hosts
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/known_hosts
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Generate protected deployment environment
        run: |
          set -euo pipefail
          umask 077
          variables=(
            FEEDFATHOM_TAG STACK_NAME POSTGRES_VOLUME_NAME REDIS_VOLUME_NAME SERVER_HOST_PORT
            DATABASE_URL POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD FEED_FATHOM_DOMAIN FEED_FATHOM_ALT_DOMAIN
            ALLOWED_EMAILS ENABLE_REGISTRATION APP_REPLICAS WORKER_REPLICAS WORKER_CONCURRENCY
            LOCK_DURATION CLEANUP_INTERVAL GATHER_JOBS_INTERVAL WORKER_CPU_LIMIT WORKER_MEM_LIMIT
            WORKER_CPU_RESERVATION WORKER_MEM_RESERVATION MAIL_ENABLED MAIL_RELAY_SECRET
            MAILJET_API_KEY MAILJET_API_SECRET TURNSTILE_SITE_KEY TURNSTILE_SECRET_KEY
          )
          for name in "${variables[@]}"; do
            printf '%s=%q\n' "$name" "${!name}"
          done > deployment.env
          chmod 600 deployment.env

      - name: Transfer deployment files
        run: |
          set -euo pipefail
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          SSH_DEST="${SSH_USER}@${SSH_HOST}"
          SSH_OPTS=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ServerAliveInterval=30 -o ServerAliveCountMax=3)
          printf -v DEPLOY_PATH_Q '%q' "$DEPLOY_PATH"
          ssh "${SSH_OPTS[@]}" "$SSH_DEST" "install -d -m 700 -- $DEPLOY_PATH_Q"
          scp "${SSH_OPTS[@]}" deploy/stack.yml deploy/stack.port.yml deployment.env "$SSH_DEST:$DEPLOY_PATH/"
          ssh "${SSH_OPTS[@]}" "$SSH_DEST" "chmod 600 -- $DEPLOY_PATH_Q/deployment.env"

      - name: Deploy Swarm stack
        run: |
          set -euo pipefail
          SSH_DEST="${SSH_USER}@${SSH_HOST}"
          SSH_OPTS=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ServerAliveInterval=30 -o ServerAliveCountMax=3)
          printf -v DEPLOY_PATH_Q '%q' "$DEPLOY_PATH"
          ssh "${SSH_OPTS[@]}" "$SSH_DEST" "bash -s -- $DEPLOY_PATH_Q" <<'REMOTE'
          set -Eeuo pipefail
          cd "$1"
          chmod 600 deployment.env
          set -a
          source ./deployment.env
          set +a

          [[ "$STACK_NAME" =~ ^[a-z0-9][a-z0-9_-]*$ ]]
          [[ "$FEEDFATHOM_TAG" =~ ^[0-9a-f]{40}$ ]]
          if ! command -v timeout >/dev/null || ! timeout -k 1s 1s true >/dev/null 2>&1; then
            printf '%s\n' 'A timeout command supporting -k is required' >&2
            exit 1
          fi

          SERVER_IMAGE="ghcr.io/smartrss/feedfathom/feedfathom-server:${FEEDFATHOM_TAG}"
          WORKER_IMAGE="ghcr.io/smartrss/feedfathom/feedfathom-worker:${FEEDFATHOM_TAG}"
          MIGRATOR_IMAGE="ghcr.io/smartrss/feedfathom/feedfathom-migrator:${FEEDFATHOM_TAG}"
          MIGRATION_SERVICE="${STACK_NAME}_migration"
          MIGRATION_CREATED=false

          remove_migration() {
            if [[ "$MIGRATION_CREATED" == true ]]; then
              docker service rm "$MIGRATION_SERVICE"
              MIGRATION_CREATED=false
            fi
          }

          diagnose() {
            rc=$?
            trap - ERR
            printf '%s\n' 'Deployment failed; collecting Swarm state' >&2
            docker stack services "$STACK_NAME" || true
            docker stack ps --no-trunc "$STACK_NAME" || true
            docker service inspect --format '{{.Spec.Name}} image={{.Spec.TaskTemplate.ContainerSpec.Image}}{{with .UpdateStatus}} update={{.State}} message={{.Message}}{{end}}' "${STACK_NAME}_server" "${STACK_NAME}_worker" || true
            if docker service inspect "$MIGRATION_SERVICE" >/dev/null 2>&1; then
              docker service ps --no-trunc "$MIGRATION_SERVICE" || true
              docker service logs "$MIGRATION_SERVICE" || true
            fi
            if [[ "$MIGRATION_CREATED" == true ]]; then
              docker service rm "$MIGRATION_SERVICE" || true
            fi
            exit "$rc"
          }
          trap diagnose ERR

          wait_for_migration() {
            local deadline=$((SECONDS + 600))
            local state
            local -a tasks
            while ((SECONDS < deadline)); do
              mapfile -t tasks < <(docker service ps --no-trunc --format '{{.ID}}' "$MIGRATION_SERVICE")
              if ((${#tasks[@]} > 1)); then
                printf '%s\n' 'Migration job created more than one task' >&2
                return 1
              fi
              if ((${#tasks[@]} == 1)); then
                state=$(docker inspect --format '{{.Status.State}}' "${tasks[0]}")
                case "$state" in
                  complete) return 0 ;;
                  failed|rejected|orphaned|remove|shutdown)
                    printf 'Migration task stopped in state: %s\n' "$state" >&2
                    return 1
                    ;;
                esac
              fi
              sleep 1
            done
            printf '%s\n' 'Migration job timed out' >&2
            return 1
          }

          docker stack config -c stack.yml -c stack.port.yml >/dev/null
          docker pull "$SERVER_IMAGE"
          docker pull "$WORKER_IMAGE"
          docker pull "$MIGRATOR_IMAGE"
          MIGRATOR_REPOSITORY="${MIGRATOR_IMAGE%:*}"
          MIGRATOR_DIGEST=$(docker image inspect --format '{{index .RepoDigests 0}}' "$MIGRATOR_IMAGE")
          [[ "$MIGRATOR_DIGEST" == "$MIGRATOR_REPOSITORY"@sha256:* ]]
          [[ "${MIGRATOR_DIGEST#*@sha256:}" =~ ^[0-9a-f]{64}$ ]]

          docker service create \
            --detach=true \
            --env "DATABASE_URL=$DATABASE_URL" \
            --max-concurrent 1 \
            --mode replicated-job \
            --name "$MIGRATION_SERVICE" \
            --network "${STACK_NAME}_backend" \
            --replicas 1 \
            --restart-condition none \
            --with-registry-auth \
            "$MIGRATOR_DIGEST" >/dev/null
          MIGRATION_CREATED=true
          wait_for_migration

          timeout -k 15s 600s docker stack deploy --detach=false --with-registry-auth --prune -c stack.yml -c stack.port.yml "$STACK_NAME"

          for specification in \
            "${STACK_NAME}_server|$SERVER_IMAGE" \
            "${STACK_NAME}_worker|$WORKER_IMAGE"
          do
            IFS='|' read -r service expected <<< "$specification"
            actual=$(docker service inspect --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' "$service")
            if [[ "$actual" != "$expected" && "$actual" != "${expected}@"* ]]; then
              printf '%s converged to %s, expected %s\n' "$service" "$actual" "$expected" >&2
              false
            fi
          done

          docker service inspect --format '{{.Spec.Name}} image={{.Spec.TaskTemplate.ContainerSpec.Image}}{{with .UpdateStatus}} update={{.State}} message={{.Message}}{{end}}' "${STACK_NAME}_server" "${STACK_NAME}_worker"
          docker stack services "$STACK_NAME"
          SPA_HTML=$(curl --fail-with-body --location --retry 10 --retry-delay 3 --retry-all-errors --connect-timeout 5 --max-time 10 --show-error "http://${FEED_FATHOM_DOMAIN}/")
          if ! grep -Fq 'id="app"' <<< "$SPA_HTML"; then
            printf '%s\n' 'Public root did not contain the expected SPA app marker' >&2
            false
          fi
          remove_migration
          trap - ERR
          REMOTE

  pages_build:
    name: Build docs site with signed extension
    needs: build_extension
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.build_extension.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      EXTENSION_VERSION: ${{ needs.build_extension.outputs.extension_version }}
      BUILD_DATE: ${{ needs.build_extension.outputs.build_date }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Download signed extension artifact
        uses: actions/download-artifact@v8
        with:
          name: extension-build
          path: dist-extension

      - name: Publish extension files to docs
        run: |
          mkdir -p docs/assets/extension
          cp dist-extension/feedfathom_ff.xpi docs/assets/extension/feedfathom_ff.xpi
          cp dist-extension/feedfathom_ch.zip docs/assets/extension/feedfathom_ch.zip

      - name: Create Firefox update manifest
        run: |
          FF_HASH=$(sha256sum docs/assets/extension/feedfathom_ff.xpi | cut -d' ' -f1)
          export FF_HASH
          bun -e '
            const manifest = await Bun.file("dist-extension/manifest.json").json();
            const gecko = manifest.browser_specific_settings.gecko;
            const updates = {
              addons: {
                [gecko.id]: {
                  updates: [{
                    version: manifest.version,
                    update_link: `${process.env.PAGES_URL}/assets/extension/feedfathom_ff.xpi`,
                    update_hash: `sha256:${process.env.FF_HASH}`,
                    applications: {
                      gecko: { strict_min_version: gecko.strict_min_version },
                    },
                  }],
                },
              },
            };
            await Bun.write(
              "docs/assets/updates.json",
              `${JSON.stringify(updates, null, 2)}\n`,
            );
          '

      - name: Update extension documentation
        run: |
          sed -i \
            -e "s|FIREFOX_VERSION|$EXTENSION_VERSION|g" \
            -e "s|CHROME_VERSION|$EXTENSION_VERSION|g" \
            -e "s|FIREFOX_DOWNLOAD_URL|$PAGES_URL/assets/extension/feedfathom_ff.xpi|g" \
            -e "s|CHROME_DOWNLOAD_URL|$PAGES_URL/assets/extension/feedfathom_ch.zip|g" \
            -e "s|BUILD_DATE|$BUILD_DATE|g" \
            docs/extension.md

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  pages_deploy:
    name: Deploy docs site
    needs: pages_build
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.pages_build.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
