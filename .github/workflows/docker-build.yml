name: Release Pipeline

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:
    inputs:
      deploy_tag:
        description: Full 40-character lowercase commit SHA already published to GHCR
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/smartrss/feedfathom

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  pr_smoke:
    name: Build and smoke internal PR images
    needs: quality
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/release-smoke.yml
    permissions:
      contents: read
      packages: read
    with:
      checkout_ref: ${{ github.sha }}
      feedfathom_tag: ${{ github.sha }}
      build_locally: true

  pr_gate:
    name: PR gate
    needs:
      - quality
      - pr_smoke
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require the quality checks to have passed
        env:
          QUALITY: ${{ needs.quality.result }}
        run: |
          set -euo pipefail
          if [[ "$QUALITY" != "success" ]]; then
            echo "::error::quality did not pass (result: $QUALITY)."
            exit 1
          fi

      - name: Require the image smoke to have passed, unless it could not run
        env:
          IS_FORK: >-
            ${{ github.event.pull_request.head.repo.full_name
                != github.repository }}
          SMOKE: ${{ needs.pr_smoke.result }}
        run: |
          set -euo pipefail
          if [[ "$SMOKE" == "success" ]]; then
            echo "Image smoke passed."
            exit 0
          fi
          if [[ "$SMOKE" == "skipped" && "$IS_FORK" == "true" ]]; then
            echo "Fork PR: internal image smoke cannot run without registry" \
              "credentials. Quality checks still gate this merge."
            exit 0
          fi
          echo "::error::Image smoke did not pass (result: $SMOKE)."
          exit 1

  build_metadata:
    name: Compute shared release version
    needs: quality
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Compute version
        id: metadata
        run: |
          YEAR_FIELD=$(( 10#$(date -u +%y) ))
          DOY=$(( 10#$(date -u +%j) ))
          HOUR=$(( 10#$(date -u +%H) ))
          MINUTE=$(( 10#$(date -u +%M) ))
          SECOND=$(( 10#$(date -u +%S) ))
          MINUTE_OF_DAY=$(( HOUR * 60 + MINUTE ))
          DOY_FIELD=$(( DOY + 100 ))
          MINUTE_OF_DAY_FIELD=$(( MINUTE_OF_DAY + 1000 ))
          SECOND_FIELD=$(( SECOND + 10 ))
          echo "version=$YEAR_FIELD.$DOY_FIELD.$MINUTE_OF_DAY_FIELD.$SECOND_FIELD" >> "$GITHUB_OUTPUT"

  build_platform_images:
    name: Build ${{ matrix.target }} for ${{ matrix.platform.arch }}
    needs: [quality, build_metadata]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    strategy:
      fail-fast: false
      matrix:
        target:
          - feedfathom-server
          - feedfathom-worker
          - feedfathom-migrator
        platform:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.target }} for linux/${{ matrix.platform.arch }}
        id: build
        uses: docker/build-push-action@v7
        timeout-minutes: 30
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.platform.arch }}
          build-args: |
            FEEDFATHOM_BUILD=${{ github.ref == 'refs/heads/main' && needs.build_metadata.outputs.version || github.sha }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/${{ matrix.target }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.platform.arch }}
          provenance: false

      - name: Hand the digest to the manifest job
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.target }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish_images:
    name: Publish ${{ matrix.target }} immutable image
    needs: build_platform_images
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    strategy:
      fail-fast: false
      matrix:
        target:
          - feedfathom-server
          - feedfathom-worker
          - feedfathom-migrator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.target }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble the multi-arch manifest
        run: |
          set -euo pipefail
          count=$(find /tmp/digests -type f | wc -l)
          if ((count != 2)); then
            printf 'expected 2 platform digests, found %s\n' "$count" >&2
            exit 1
          fi
          docker buildx imagetools create \
            --tag "${IMAGE_PREFIX}/${{ matrix.target }}:${GITHUB_SHA}" \
            $(find /tmp/digests -type f -printf "${IMAGE_PREFIX}/${{ matrix.target }}@sha256:%f ")

  build_extension:
    name: Build and sign browser extension
    needs: [quality, build_metadata]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      build_date: ${{ steps.metadata.outputs.build_date }}
      extension_version: ${{ needs.build_metadata.outputs.version }}
      changed: ${{ steps.content.outputs.changed }}
    env:
      GH_TOKEN: ${{ github.token }}
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Bun project
        uses: ./.github/actions/bun-project

      - name: Set build date
        id: metadata
        run: |
          echo "build_date=$(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Build extension variants
        env:
          FIREFOX_UPDATE_URL: ${{ env.PAGES_URL }}/assets/updates.json
          CHROMIUM_UPDATE_URL: ${{ env.PAGES_URL }}/assets/updates.xml
          EXTENSION_VERSION: ${{ needs.build_metadata.outputs.version }}
        run: bun run build-extension

      - name: Detect whether the extension actually changed
        id: content
        run: |
          set -euo pipefail
          CONTENT_HASH=$(bun -e '
            import { createHash } from "node:crypto";
            import { readdirSync, statSync, readFileSync } from "node:fs";
            const root = "ext";
            const walk = (dir) => readdirSync(dir).flatMap((entry) => {
              const full = `${dir}/${entry}`;
              return statSync(full).isDirectory() ? walk(full) : [full];
            });
            const hash = createHash("sha256");
            for (const file of [...walk("ext/build-ch"), ...walk("ext/build-ff")].sort()) {
              hash.update(file.slice(root.length));
              if (file.endsWith("/manifest.json")) {
                const { version, ...rest } = JSON.parse(readFileSync(file, "utf8"));
                hash.update(JSON.stringify(rest));
              } else {
                hash.update(readFileSync(file));
              }
            }
            process.stdout.write(hash.digest("hex"));
          ')
          printf 'Built extension content hash: %s\n' "$CONTENT_HASH"

          if [[ "$GITHUB_REF" == 'refs/heads/main' ]]; then
            WANT_PRERELEASE=false
          else
            WANT_PRERELEASE=true
          fi
          PREVIOUS_TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq "[.[]
                   | select(.draft | not)
                   | select(.prerelease == ${WANT_PRERELEASE})
                   | select([.assets[].name] | index(\"extension-content-hash.txt\"))]
                  | first | .tag_name // empty")
          PREVIOUS_HASH=""
          if [ -n "$PREVIOUS_TAG" ]; then
            gh release download "$PREVIOUS_TAG" --pattern extension-content-hash.txt --output - > /tmp/previous-hash
            PREVIOUS_HASH=$(tr -d '[:space:]' < /tmp/previous-hash)
            printf 'Comparing against %s\n' "$PREVIOUS_TAG"
          fi

          if [ -n "$PREVIOUS_HASH" ] && [ "$PREVIOUS_HASH" = "$CONTENT_HASH" ]; then
            printf '%s\n' 'Extension content is unchanged -- skipping signing, release assets, and the docs/update-manifest refresh.'
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          printf '%s' "$CONTENT_HASH" > /tmp/extension-content-hash.txt

      - name: Sign Firefox extension
        if: steps.content.outputs.changed == 'true'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          mkdir -p signed-extension dist-extension
          bunx web-ext sign \
            --source-dir ext/build-ff \
            --artifacts-dir signed-extension \
            --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" \
            --no-input \
            --timeout 900000 \
            --approval-timeout 900000

          shopt -s nullglob
          SIGNED_XPIS=(signed-extension/*.xpi)
          if [ "${#SIGNED_XPIS[@]}" -ne 1 ]; then
            echo "Expected one AMO-signed XPI, found ${#SIGNED_XPIS[@]}" >&2
            exit 1
          fi
          cp "${SIGNED_XPIS[0]}" dist-extension/feedfathom_ff.xpi
          cp ext/feedfathom_ch.zip dist-extension/feedfathom_ch.zip
          cp ext/build-ff/manifest.json dist-extension/manifest.json

      - name: Pack Chromium extension
        if: steps.content.outputs.changed == 'true'
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/crx.pem"
          trap 'rm -f "$KEY_FILE"' EXIT
          (umask 077 && printf '%s\n' "$CRX_PRIVATE_KEY" > "$KEY_FILE")
          bunx crx3@2.0.0 -p "$KEY_FILE" -o dist-extension/feedfathom_ch.crx < ext/feedfathom_ch.zip
          head -c 4 dist-extension/feedfathom_ch.crx | grep -q '^Cr24$'

      - name: Verify signed Firefox release
        if: steps.content.outputs.changed == 'true'
        run: |
          cp /tmp/extension-content-hash.txt dist-extension/extension-content-hash.txt
          unzip -Z1 dist-extension/feedfathom_ff.xpi | grep -q '^META-INF/'
          unzip -p dist-extension/feedfathom_ff.xpi manifest.json > /tmp/signed-manifest.json
          bun -e '
            const generated = await Bun.file("ext/build-ff/manifest.json").json();
            const signed = await Bun.file("/tmp/signed-manifest.json").json();
            if (
              signed.version !== generated.version ||
              signed.browser_specific_settings.gecko.strict_min_version !==
                generated.browser_specific_settings.gecko.strict_min_version
            ) {
              throw new Error("Signed Firefox manifest does not match the generated one");
            }
          '

      - name: Upload signed extension artifact
        if: steps.content.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: extension-build
          path: dist-extension
          retention-days: 30

  validate_deploy_tag:
    name: Validate existing deployment manifests
    needs: quality
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_TAG: ${{ inputs.deploy_tag }}

    steps:
      - name: Require a full immutable commit SHA
        run: |
          if [[ ! "$DEPLOY_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' 'deploy_tag must be exactly 40 lowercase hexadecimal characters' >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify all exact-tag manifests exist
        run: |
          set -euo pipefail
          for target in feedfathom-server feedfathom-worker feedfathom-migrator; do
            docker buildx imagetools inspect "${IMAGE_PREFIX}/${target}:${DEPLOY_TAG}" >/dev/null
          done

  release_smoke_push:
    name: Smoke exact published images (push)
    needs: publish_images
    uses: ./.github/workflows/release-smoke.yml
    permissions:
      contents: read
      packages: read
    with:
      checkout_ref: ${{ github.sha }}
      feedfathom_tag: ${{ github.sha }}

  release_smoke_dispatch:
    name: Smoke exact published images (dispatch)
    needs: validate_deploy_tag
    uses: ./.github/workflows/release-smoke.yml
    permissions:
      contents: read
      packages: read
    with:
      checkout_ref: ${{ inputs.deploy_tag }}
      feedfathom_tag: ${{ inputs.deploy_tag }}

  await_turn:
    name: Wait for older merges to finish
    needs: release_smoke_push
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Wait until no older run of this workflow is in flight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 4800))
          while ((SECONDS < deadline)); do
            older=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/docker-build.yml/runs?branch=${GITHUB_REF_NAME}&per_page=100" \
              --jq "[.workflow_runs[]
                     | select(.status != \"completed\")
                     | select(.id < ${GITHUB_RUN_ID})] | length")
            if ((older == 0)); then
              printf '%s\n' 'Nothing older in flight; taking the turn.'
              exit 0
            fi
            printf '%s older run(s) in flight; waiting.\n' "$older"
            sleep 20
          done
          echo "::error::Timed out waiting for older runs to finish."
          exit 1

  promote:
    name: Promote verified ${{ matrix.target }} manifest to a channel tag
    needs: await_turn
    strategy:
      fail-fast: false
      matrix:
        target:
          - feedfathom-server
          - feedfathom-worker
          - feedfathom-migrator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      CHANNEL_TAG: ${{ github.ref == 'refs/heads/main' && 'latest' || 'staging' }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote exact verified manifest
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_PREFIX}/${{ matrix.target }}:${CHANNEL_TAG}" \
            "${IMAGE_PREFIX}/${{ matrix.target }}:${GITHUB_SHA}"

  create_release:
    name: Create GitHub release
    needs: [build_extension, promote]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EXTENSION_VERSION: ${{ needs.build_extension.outputs.extension_version }}

    steps:
      - name: Download signed extension artifact
        if: needs.build_extension.outputs.changed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: extension-build
          path: dist-extension

      - name: Set release metadata
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" == 'refs/heads/main' ]]; then
            {
              echo "TAG=v${EXTENSION_VERSION}"
              echo "TITLE=FeedFathom v${EXTENSION_VERSION}"
              echo "PRERELEASE=false"
            } >> "$GITHUB_ENV"
          else
            {
              echo "TAG=staging-${EXTENSION_VERSION}"
              echo "TITLE=Staging ${EXTENSION_VERSION}"
              echo "PRERELEASE=true"
            } >> "$GITHUB_ENV"
          fi
          if [[ "${{ needs.build_extension.outputs.changed }}" == 'true' ]]; then
            mv dist-extension/feedfathom_ff.xpi "dist-extension/feedfathom-firefox-${EXTENSION_VERSION}.xpi"
            mv dist-extension/feedfathom_ch.zip "dist-extension/feedfathom-chrome-${EXTENSION_VERSION}.zip"
            mv dist-extension/feedfathom_ch.crx "dist-extension/feedfathom-chrome-${EXTENSION_VERSION}.crx"
          fi

      - name: Create release
        run: |
          set -euo pipefail
          prerelease_flag=()
          if [[ "$PRERELEASE" == 'true' ]]; then
            prerelease_flag+=(--prerelease)
          fi
          notes_start_tag=()
          LAST_STABLE_TAG=$(gh release list --exclude-drafts --exclude-pre-releases \
            --json tagName,createdAt -q 'sort_by(.createdAt) | reverse | .[0].tagName // empty')
          if [[ -n "$LAST_STABLE_TAG" ]]; then
            notes_start_tag=(--notes-start-tag "$LAST_STABLE_TAG")
          fi
          extension_assets=()
          EXTENSION_NOTE='- extension: unchanged since the previous release'
          if [[ "${{ needs.build_extension.outputs.changed }}" == 'true' ]]; then
            extension_assets=(
              "dist-extension/feedfathom-firefox-${EXTENSION_VERSION}.xpi"
              "dist-extension/feedfathom-chrome-${EXTENSION_VERSION}.zip"
              "dist-extension/feedfathom-chrome-${EXTENSION_VERSION}.crx"
              "dist-extension/extension-content-hash.txt"
            )
            EXTENSION_NOTE="- extension: \`${EXTENSION_VERSION}\` (attached)"
          fi
          gh release create "$TAG" \
            --title "$TITLE" \
            --target "${{ github.sha }}" \
            --generate-notes \
            "${notes_start_tag[@]}" \
            "${prerelease_flag[@]}" \
            "${extension_assets[@]}"

          IMAGE_NOTES=$(cat <<EOF

          ## Images
          Published to GHCR at this commit (\`${GITHUB_SHA}\`):
          - \`${IMAGE_PREFIX}/feedfathom-server:${GITHUB_SHA}\`
          - \`${IMAGE_PREFIX}/feedfathom-worker:${GITHUB_SHA}\`
          - \`${IMAGE_PREFIX}/feedfathom-migrator:${GITHUB_SHA}\`

          ## Extension
          ${EXTENSION_NOTE}
          EOF
          )
          EXISTING_BODY=$(gh release view "$TAG" --json body -q .body)
          gh release edit "$TAG" --notes "${EXISTING_BODY}${IMAGE_NOTES}"

  deploy:
    name: Deploy to production Swarm
    runs-on: ubuntu-latest
    needs: [promote, release_smoke_dispatch]
    if: >-
      !cancelled() &&
      vars.ENABLE_SWARM_DEPLOYMENT == 'true' &&
      github.ref == 'refs/heads/main' &&
      (needs.promote.result == 'success' ||
       needs.release_smoke_dispatch.result == 'success')
    outputs:
      skipped: ${{ steps.ancestry.outputs.skip }}
    timeout-minutes: 30
    permissions:
      contents: read
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      FEEDFATHOM_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_tag || github.sha }}
      STACK_NAME: ${{ vars.STACK_NAME }}
      POSTGRES_VOLUME_NAME: ${{ vars.POSTGRES_VOLUME_NAME }}
      REDIS_VOLUME_NAME: ${{ vars.REDIS_VOLUME_NAME }}
      SERVER_HOST_PORT: ${{ vars.SERVER_HOST_PORT }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      FEED_FATHOM_DOMAIN: ${{ secrets.FEED_FATHOM_DOMAIN }}
      FEED_FATHOM_ALT_DOMAIN: ${{ vars.FEED_FATHOM_ALT_DOMAIN }}
      ALLOWED_EMAILS: ${{ vars.ALLOWED_EMAILS }}
      ENABLE_REGISTRATION: ${{ vars.ENABLE_REGISTRATION }}
      APP_REPLICAS: ${{ vars.APP_REPLICAS }}
      WORKER_REPLICAS: ${{ vars.WORKER_REPLICAS }}
      WORKER_CONCURRENCY: ${{ vars.WORKER_CONCURRENCY }}
      LOCK_DURATION: ${{ vars.LOCK_DURATION }}
      CLEANUP_INTERVAL: ${{ vars.CLEANUP_INTERVAL }}
      GATHER_JOBS_INTERVAL: ${{ vars.GATHER_JOBS_INTERVAL }}
      WORKER_CPU_LIMIT: ${{ vars.WORKER_CPU_LIMIT }}
      WORKER_MEM_LIMIT: ${{ vars.WORKER_MEM_LIMIT }}
      WORKER_CPU_RESERVATION: ${{ vars.WORKER_CPU_RESERVATION }}
      WORKER_MEM_RESERVATION: ${{ vars.WORKER_MEM_RESERVATION }}
      MAIL_ENABLED: ${{ vars.MAIL_ENABLED }}
      MAIL_DOMAIN: ${{ vars.MAIL_DOMAIN }}
      MAIL_RELAY_SECRET: ${{ secrets.MAIL_RELAY_SECRET }}
      MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
      MAILJET_API_SECRET: ${{ secrets.MAILJET_API_SECRET }}
      TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}

    steps:
      - name: Checkout deployment stack
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_tag || github.sha }}
          sparse-checkout: |
            compose.yml
            deploy/stack.yml
          sparse-checkout-cone-mode: false

      - name: Checkout deploy script
        uses: actions/checkout@v7
        with:
          path: pipeline
          sparse-checkout: deploy/deploy.sh
          sparse-checkout-cone-mode: false

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure trusted SSH hosts
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/known_hosts
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Refuse to roll production backwards
        id: ancestry
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$STACK_NAME" =~ ^[a-z0-9][a-z0-9_-]*$ ]]
          SSH_DEST="${SSH_USER}@${SSH_HOST}"
          SSH_OPTS=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          LIVE=$(ssh "${SSH_OPTS[@]}" "$SSH_DEST" \
            "docker service inspect --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' ${STACK_NAME}_server" \
            || true)
          LIVE="${LIVE%@*}"
          LIVE="${LIVE##*:}"
          if [[ ! "$LIVE" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'No 40-hex live tag (%s); treating this as a first deploy.\n' "${LIVE:-<none>}"
            exit 0
          fi
          STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${LIVE}...${GITHUB_SHA}" --jq .status)
          printf 'Production runs %s (%s relative to %s).\n' "$LIVE" "$STATUS" "$GITHUB_SHA"
          if [[ "$STATUS" == 'behind' || "$STATUS" == 'identical' ]]; then
            echo "::notice::Production is already at or past ${GITHUB_SHA}; skipping the deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate protected deployment environment
        run: |
          set -euo pipefail
          umask 077
          variables=(
            IMAGE_PREFIX
            FEEDFATHOM_TAG STACK_NAME POSTGRES_VOLUME_NAME REDIS_VOLUME_NAME SERVER_HOST_PORT
            DATABASE_URL POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD FEED_FATHOM_DOMAIN FEED_FATHOM_ALT_DOMAIN
            ALLOWED_EMAILS ENABLE_REGISTRATION APP_REPLICAS WORKER_REPLICAS WORKER_CONCURRENCY
            LOCK_DURATION CLEANUP_INTERVAL GATHER_JOBS_INTERVAL WORKER_CPU_LIMIT WORKER_MEM_LIMIT
            WORKER_CPU_RESERVATION WORKER_MEM_RESERVATION MAIL_ENABLED MAIL_DOMAIN MAIL_RELAY_SECRET
            MAILJET_API_KEY MAILJET_API_SECRET TURNSTILE_SITE_KEY TURNSTILE_SECRET_KEY
          )
          for name in "${variables[@]}"; do
            printf '%s=%q\n' "$name" "${!name}"
          done > deployment.env
          chmod 600 deployment.env

      - name: Transfer deployment files
        if: steps.ancestry.outputs.skip != 'true'
        run: |
          set -euo pipefail
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          SSH_DEST="${SSH_USER}@${SSH_HOST}"
          SSH_OPTS=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ServerAliveInterval=30 -o ServerAliveCountMax=3)
          printf -v DEPLOY_PATH_Q '%q' "$DEPLOY_PATH"
          ssh "${SSH_OPTS[@]}" "$SSH_DEST" "install -d -m 700 -- $DEPLOY_PATH_Q"
          scp "${SSH_OPTS[@]}" compose.yml deploy/stack.yml deployment.env "$SSH_DEST:$DEPLOY_PATH/"
          ssh "${SSH_OPTS[@]}" "$SSH_DEST" "chmod 600 -- $DEPLOY_PATH_Q/deployment.env"

      - name: Deploy Swarm stack
        if: steps.ancestry.outputs.skip != 'true'
        run: pipeline/deploy/deploy.sh

  deploy_email_worker:
    name: Deploy Cloudflare email Worker
    needs: deploy
    if: >-
      !cancelled() &&
      needs.deploy.result == 'success' &&
      needs.deploy.outputs.skipped != 'true' &&
      vars.EMAIL_WORKER_SCRIPT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment: production
    concurrency:
      group: email-worker
      cancel-in-progress: false
    env:
      ACCOUNT_ID: ${{ vars.EMAIL_WORKER_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MAIL_ENDPOINT_DOMAIN: ${{ vars.MAIL_ENDPOINT_DOMAIN }}
      MAIL_RELAY_SECRET: ${{ secrets.MAIL_RELAY_SECRET }}
      SCRIPT_NAME: ${{ vars.EMAIL_WORKER_SCRIPT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Bun project
        uses: ./.github/actions/bun-project

      - name: Build the Worker bundle
        run: bun run build-cloudflare-email-worker

      - name: Upload the Worker when its deployed content differs
        run: |
          set -euo pipefail
          umask 077
          test -n "$ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$MAIL_ENDPOINT_DOMAIN"
          test -n "$MAIL_RELAY_SECRET"
          API="https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${SCRIPT_NAME}"
          AUTH=(--header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")

          CONTENT_HASH="content:$(
            {
              cat build/cloudflare-email-worker.js
              printf '%s\n%s' "$MAIL_ENDPOINT_DOMAIN" "$MAIL_RELAY_SECRET"
            } | sha256sum | cut -d' ' -f1
          )"
          DEPLOYED=$(curl --fail-with-body --silent --show-error "${AUTH[@]}" "${API}/settings" \
            | jq -r '[.result.tags[]? | select(startswith("content:"))] | first // ""')

          if [[ "$DEPLOYED" == "$CONTENT_HASH" ]]; then
            printf 'Worker already at %s -- nothing to upload.\n' "$CONTENT_HASH"
            exit 0
          fi
          printf 'Deployed %s, building %s -- uploading.\n' "${DEPLOYED:-<none>}" "$CONTENT_HASH"

          jq -n --arg hash "$CONTENT_HASH" --arg domain "$MAIL_ENDPOINT_DOMAIN" '{
            main_module: "worker.js",
            compatibility_date: "2025-05-05",
            tags: [$hash],
            bindings: [
              { type: "plain_text", name: "MAIL_ENDPOINT_DOMAIN", text: $domain },
              { type: "secret_text", name: "MAIL_RELAY_SECRET", text: $ENV.MAIL_RELAY_SECRET }
            ]
          }' > metadata.json

          curl --fail-with-body --silent --show-error --request PUT "${AUTH[@]}" "$API" \
            --form "metadata=@metadata.json;type=application/json" \
            --form "worker.js=@build/cloudflare-email-worker.js;filename=worker.js;type=application/javascript+module" \
            | jq -e '.success' > /dev/null
          rm -f metadata.json

          curl --fail-with-body --silent --show-error "${AUTH[@]}" "${API}/settings" \
            | jq -e --arg hash "$CONTENT_HASH" '
                (.result.tags | index($hash)) and
                ([.result.bindings[].name] | sort == ["MAIL_ENDPOINT_DOMAIN", "MAIL_RELAY_SECRET"])
              ' > /dev/null
          printf 'Uploaded %s.\n' "$CONTENT_HASH"

  close_released_issues:
    name: Close issues released to production
    needs: deploy
    if: "!cancelled() && needs.deploy.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Close each on-staging issue whose PRs are all deployed
        run: |
          set -euo pipefail
          owner=${GH_REPO%/*} name=${GH_REPO#*/}
          for n in $(gh issue list --label on-staging --state open --limit 200 --json number --jq '.[].number'); do
            merges=$(gh api graphql -F owner="$owner" -F name="$name" -F n="$n" -f query='
              query($owner: String!, $name: String!, $n: Int!) {
                repository(owner: $owner, name: $name) { issue(number: $n) {
                  timelineItems(itemTypes: [CROSS_REFERENCED_EVENT], first: 100) { nodes {
                    ... on CrossReferencedEvent { source { ... on PullRequest { mergeCommit { oid } } } }
                  } }
                } }
              }' --jq '.data.repository.issue.timelineItems.nodes[].source.mergeCommit.oid // empty')
            if [[ -z "$merges" ]]; then
              echo "::warning::#$n is on-staging but no merged PR references it; close it by hand."
              continue
            fi
            pending=0
            for oid in $merges; do
              status=$(gh api "repos/$GH_REPO/compare/$oid...$GITHUB_SHA" --jq .status) || status=unknown
              [[ "$status" == ahead || "$status" == identical ]] || pending=1
            done
            if (( pending )); then
              echo "#$n has a merged PR not yet in $GITHUB_SHA; leaving it open."
              continue
            fi
            gh issue close "$n" --reason completed --comment "Released to production in \`${GITHUB_SHA:0:8}\`."
            gh issue edit "$n" --remove-label on-staging
          done

  pages:
    name: Publish docs site with signed extension
    needs: [build_extension, await_turn]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Download signed extension artifact
        if: needs.build_extension.outputs.changed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: extension-build
          path: dist-extension

      - name: Publish extension files to docs
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_DATE: ${{ needs.build_extension.outputs.build_date }}
        run: |
          set -euo pipefail
          if [ ! -f dist-extension/feedfathom_ff.xpi ]; then
            TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '[.[]
                     | select((.draft or .prerelease) | not)
                     | select([.assets[].name] | map(endswith(".xpi")) | any)]
                    | first | .tag_name // empty')
            if [ -z "$TAG" ]; then
              printf '%s\n' 'No stable release carries a signed extension to republish' >&2
              exit 1
            fi
            printf 'Republishing the extension from %s\n' "$TAG"
            mkdir -p dist-extension
            gh release download "$TAG" --pattern '*.xpi' --output dist-extension/feedfathom_ff.xpi
            gh release download "$TAG" --pattern '*.zip' --output dist-extension/feedfathom_ch.zip
            gh release download "$TAG" --pattern '*.crx' --output dist-extension/feedfathom_ch.crx
            unzip -p dist-extension/feedfathom_ff.xpi manifest.json > dist-extension/manifest.json
            BUILD_DATE=$(date -u -d "$(gh release view "$TAG" --json publishedAt -q .publishedAt)" '+%Y-%m-%d %H:%M UTC')
          fi

          mkdir -p docs/assets/extension
          cp dist-extension/feedfathom_ff.xpi docs/assets/extension/feedfathom_ff.xpi
          cp dist-extension/feedfathom_ch.zip docs/assets/extension/feedfathom_ch.zip
          cp dist-extension/feedfathom_ch.crx docs/assets/extension/feedfathom_ch.crx

          {
            echo "EXTENSION_VERSION=$(jq -r .version dist-extension/manifest.json)"
            echo "BUILD_DATE=$BUILD_DATE"
          } >> "$GITHUB_ENV"

      - name: Create Firefox update manifest
        run: |
          FF_HASH=$(sha256sum docs/assets/extension/feedfathom_ff.xpi | cut -d' ' -f1)
          export FF_HASH
          bun -e '
            const manifest = await Bun.file("dist-extension/manifest.json").json();
            const gecko = manifest.browser_specific_settings.gecko;
            const updates = {
              addons: {
                [gecko.id]: {
                  updates: [{
                    version: manifest.version,
                    update_link: `${process.env.PAGES_URL}/assets/extension/feedfathom_ff.xpi`,
                    update_hash: `sha256:${process.env.FF_HASH}`,
                    applications: {
                      gecko: { strict_min_version: gecko.strict_min_version },
                    },
                  }],
                },
              },
            };
            await Bun.write(
              "docs/assets/updates.json",
              `${JSON.stringify(updates, null, 2)}\n`,
            );
          '

      - name: Create Chromium update manifest
        run: |
          cat > docs/assets/updates.xml <<EOF
          <?xml version='1.0' encoding='UTF-8'?>
          <gupdate xmlns='http://www.google.com/update2/response' protocol='2.0'>
            <app appid='niaphaclbdnodpimigmdjmbgcmlopifj'>
              <updatecheck codebase='$PAGES_URL/assets/extension/feedfathom_ch.crx' version='$EXTENSION_VERSION' />
            </app>
          </gupdate>
          EOF

      - name: Update extension documentation
        run: |
          sed -i \
            -e "s|FIREFOX_VERSION|$EXTENSION_VERSION|g" \
            -e "s|CHROME_VERSION|$EXTENSION_VERSION|g" \
            -e "s|FIREFOX_DOWNLOAD_URL|$PAGES_URL/assets/extension/feedfathom_ff.xpi|g" \
            -e "s|CHROME_DOWNLOAD_URL|$PAGES_URL/assets/extension/feedfathom_ch.crx|g" \
            -e "s|BUILD_DATE|$BUILD_DATE|g" \
            docs/extension.md

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
