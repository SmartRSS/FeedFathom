name: Manual Redeploy

on:
  workflow_dispatch:
    inputs:
      deploy_tag:
        description: Full 40-character lowercase commit SHA already published to GHCR
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/smartrss/feedfathom

jobs:
  validate_deploy_tag:
    name: Validate existing deployment manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_TAG: ${{ inputs.deploy_tag }}
    steps:
      - name: Require a full immutable commit SHA
        run: |
          if [[ ! "$DEPLOY_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' 'deploy_tag must be exactly 40 lowercase hexadecimal characters' >&2
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify all exact-tag manifests exist
        run: |
          set -euo pipefail
          for target in feedfathom-server feedfathom-worker feedfathom-migrator; do
            docker buildx imagetools inspect "${IMAGE_PREFIX}/${target}:${DEPLOY_TAG}" >/dev/null
          done

  release_smoke:
    name: Smoke exact published images
    needs: validate_deploy_tag
    uses: ./.github/workflows/release-smoke.yml
    permissions:
      contents: read
      packages: read
    with:
      checkout_ref: ${{ inputs.deploy_tag }}
      feedfathom_tag: ${{ inputs.deploy_tag }}

  await_turn:
    name: Wait for in-flight releases to finish
    needs: release_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Wait until no release or older redeploy is in flight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 4800))
          while ((SECONDS < deadline)); do
            releases=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?branch=main&per_page=100" \
              --jq '[.workflow_runs[] | select(.status != "completed")] | length')
            older=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/redeploy.yml/runs?per_page=100" \
              --jq "[.workflow_runs[]
                     | select(.status != \"completed\")
                     | select(.id < ${GITHUB_RUN_ID})] | length")
            if ((releases == 0 && older == 0)); then
              printf '%s\n' 'Nothing older in flight; taking the turn.'
              exit 0
            fi
            printf '%s release(s) and %s older redeploy(s) in flight; waiting.\n' "$releases" "$older"
            sleep 20
          done
          echo "::error::Timed out waiting for in-flight runs to finish."
          exit 1

  deploy:
    name: Deploy to production
    needs: await_turn
    uses: ./.github/workflows/deploy-production.yml
    with:
      deploy_tag: ${{ inputs.deploy_tag }}
      refuse_rollback: false
    secrets: inherit
