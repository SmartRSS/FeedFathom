name: Smoke exact published images

on:
  workflow_call:
    inputs:
      checkout_ref:
        required: true
        type: string
      feedfathom_tag:
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FEEDFATHOM_TAG: ${{ inputs.feedfathom_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull exact release images
        run: docker compose -f deploy/compose.smoke.yml pull migrator server worker redis postgres

      - name: Start exact release images without rebuilding or pulling
        run: docker compose -f deploy/compose.smoke.yml up -d --wait --wait-timeout 300 --no-build --pull never

      - name: Run production browser smoke test
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3456
        run: bun run test:smoke

      - name: Print logs on failure
        if: failure()
        run: |
          printf '%s\n' 'Verification failed. Printing logs for all services:'
          docker compose -f deploy/compose.smoke.yml logs migrator worker server
          printf '%s\n' 'Current container status:'
          docker compose -f deploy/compose.smoke.yml ps

      - name: Cleanup
        if: always()
        run: docker compose -f deploy/compose.smoke.yml down
