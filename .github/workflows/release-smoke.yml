name: Smoke published or freshly built images

on:
  workflow_call:
    inputs:
      checkout_ref:
        required: true
        type: string
      feedfathom_tag:
        required: true
        type: string
      # PRs have nothing in GHCR to pull -- images are only published from
      # pushes to main and staging -- so they build the three app services
      # from the checkout instead. Everything after that (start, smoke, dump
      # logs, tear down) is identical either way, which is the whole reason
      # this is one workflow.
      build_locally:
        description: Build the app images from this checkout instead of pulling them from GHCR.
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

jobs:
  smoke:
    name: Smoke test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: ${{ inputs.build_locally && 45 || 15 }}
    env:
      FEEDFATHOM_TAG: ${{ inputs.feedfathom_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Set up Bun project
        uses: ./.github/actions/bun-project
        with:
          playwright: "true"

      - name: Setup Blacksmith Builder
        if: inputs.build_locally
        uses: useblacksmith/setup-docker-builder@v1

      # Only the pull path touches GHCR; a local build reads its bases from
      # Docker Hub and tags the result under the same name compose expects.
      - name: Log in to GitHub Container Registry
        if: ${{ !inputs.build_locally }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the exact app images under test
        if: inputs.build_locally
        env:
          DOCKER_DEFAULT_PLATFORM: linux/amd64
        run: docker compose -f compose.yml -f deploy/compose.smoke.yml build migrator server worker

      - name: Pull smoke infrastructure images
        if: inputs.build_locally
        run: docker compose -f compose.yml -f deploy/compose.smoke.yml pull redis postgres

      - name: Pull exact release images
        if: ${{ !inputs.build_locally }}
        run: docker compose -f compose.yml -f deploy/compose.smoke.yml pull migrator server worker redis postgres

      # Starting and waiting are two steps because `up --wait` reports the
      # migrator's clean exit(0) as a failure, and naming services does not
      # help -- their dependencies are waited on too. The worker blocks
      # until the schema exists, so waiting on it still waits for migrations
      # to have succeeded.
      - name: Start the images under test without rebuilding or pulling
        run: |
          docker compose -f compose.yml -f deploy/compose.smoke.yml up -d --no-build --pull never
          docker compose -f compose.yml -f deploy/compose.smoke.yml up -d --wait --wait-timeout 300 --no-build --pull never server worker

      - name: Run production browser smoke test
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3456
        run: bun run test:smoke

      - name: Print logs on failure
        if: failure()
        run: |
          printf '%s\n' 'Verification failed. Printing logs for all services:'
          docker compose -f compose.yml -f deploy/compose.smoke.yml logs migrator worker server
          printf '%s\n' 'Current container status:'
          docker compose -f compose.yml -f deploy/compose.smoke.yml ps

      - name: Cleanup
        if: always()
        run: docker compose -f compose.yml -f deploy/compose.smoke.yml down
